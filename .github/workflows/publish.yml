name: Publish episodes

on:
  push:
    branches: [main]
    paths: ["episodes/**", "tools/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      voice_samples:
        description: Render a sample in every Chirp 3 HD voice to /voices/
        type: boolean
        default: false
      test_sentence:
        description: Only test Google TTS with this sentence (nothing is published)
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg festival festvox-us-slt-hts >/dev/null
      - name: Test Google TTS only
        if: ${{ inputs.test_sentence != '' }}
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          GOOGLE_TTS_RATE: ${{ vars.GOOGLE_TTS_RATE }}
          SENTENCE: ${{ inputs.test_sentence }}
        run: |
          printf '%s\n' "$SENTENCE" > "$RUNNER_TEMP/test.txt"
          python3 tools/tts.py "$RUNNER_TEMP/test.txt" "$RUNNER_TEMP/test.mp3" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -q "using Google" "$RUNNER_TEMP/out.txt" || { echo "::error::Google TTS did not work (fell back to the offline voice)"; exit 1; }
          echo "TEST OK"
      - name: Make missing episode audio
        if: ${{ inputs.test_sentence == '' || inputs.test_sentence == null }}
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          GOOGLE_TTS_RATE: ${{ vars.GOOGLE_TTS_RATE }}
        run: |
          for t in episodes/*.txt; do
            mp3="${t%.txt}.mp3"
            [ -f "$mp3" ] || python3 tools/tts.py "$t" "$mp3"
          done
      - name: Make voice samples
        if: ${{ inputs.voice_samples }}
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          GOOGLE_TTS_RATE: ${{ vars.GOOGLE_TTS_RATE }}
        run: python3 tools/voice_samples.py voices
      - name: Commit new audio
        run: |
          git config user.name "aging-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/*.mp3
          if [ -d voices ]; then git add voices; fi
          git diff --cached --quiet || (git commit -m "Add episode audio" && git push)
      - name: Build feed
        run: python3 tools/build_feed.py . "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Build site
        run: |
          mkdir -p _site/episodes
          cp feed.xml index.html _site/
          cp episodes/*.mp3 _site/episodes/
          [ -d voices ] && cp -r voices _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
